version: '3.8'

services:
  # Tier 1: Web Application (Flask Backend + Frontend UI)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: two_tier_flask_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production-12345}
      - DB_HOST=db
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-app_db}
      - MYSQL_USER=${MYSQL_USER:-flask_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-flask_secret_pwd_2026}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - two_tier_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Tier 2: Database Tier (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: two_tier_mysql_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret_pwd_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
      MYSQL_USER: ${MYSQL_USER:-flask_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flask_secret_pwd_2026}
    volumes:
      # Persistent named volume for MySQL data
      - db_data:/var/lib/mysql
      # Initial database schema and seed data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - two_tier_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret_pwd_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

# Docker Bridge Network for isolated container-to-container communication
networks:
  two_tier_network:
    name: two-tier-bridge-net
    driver: bridge

# Persistent Named Volumes
volumes:
  db_data:
    name: two_tier_mysql_data
    driver: local
